name: Build MindConnection APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK and accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore project debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Build Debug APK (signed with compatible project key)
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare named APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk MindConnection-Akbar-v1.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindConnection-Akbar-v1.3
          path: MindConnection-Akbar-v1.3.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: "هنر ارتباط ذهن‌ها - نسخه 1.3"
          body: "نسخه 1.3 (versionCode 4) - قابل نصب مستقیم روی گوشی اندروید و سازگار با نسخه 1.2."
          files: MindConnection-Akbar-v1.3.apk
          fail_on_unmatched_files: true
